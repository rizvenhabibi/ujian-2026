<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian - SMK YPM 3 TAMAN</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background: #1a1a2e;
      color: #fff;
      min-height: 100vh;
    }
    .card-mapel {
      background: #162447;
      border: 1px solid #1f4068;
      border-radius: 12px;
      transition: 0.25s;
      height: 100%;
    }
    .card-mapel:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(228, 63, 90, 0.25);
      border-color: #e43f5a;
    }
    .badge-kelas {
      background: #e43f5a;
      font-weight: 600;
    }
    .btn-mulai {
      background: #e43f5a;
      color: #fff;
      font-weight: 600;
      border: none;
    }
    .btn-mulai:hover {
      background: #ff4b6b;
      color: #fff;
    }
    .filter-bar {
      background: #162447;
      border-radius: 12px;
      padding: 16px;
    }
    .school-logo {
      width: 80px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }
    .empty-state {
      background: #162447;
      border-radius: 12px;
      padding: 40px;
      text-align: center;
      color: #cbd5e1;
    }
  </style>
</head>
<body>

<div class="container py-4">

  <!-- Header -->
  <div class="text-center mb-4">
    <img src="logo1.jpg" alt="Logo" class="school-logo mb-2"
         onerror="this.style.display='none'">
    <h2 class="fw-bold mb-1">Portal Ujian Online</h2>
    <p class="text-secondary mb-0">SMK ITABA</p>
  </div>

  <!-- Filter -->
  <div class="filter-bar mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label small text-secondary">Filter Kelas</label>
        <select id="filterKelas" class="form-select">
          <option value="">Semua Kelas</option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label small text-secondary">Cari Mata Pelajaran / Guru</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Ketik untuk mencari...">
      </div>
      <div class="col-md-2">
        <button id="btnReload" class="btn btn-outline-light w-100">
          <i class="bi bi-arrow-clockwise"></i> Muat Ulang
        </button>
      </div>
    </div>
  </div>

  <!-- Status -->
  <div id="statusInfo" class="mb-3 small text-secondary"></div>

  <!-- Daftar Ujian -->
  <div class="row g-3" id="daftarUjian"></div>

  <!-- Empty State -->
  <div id="emptyState" class="empty-state d-none">
    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
    <p class="mb-0">Tidak ada ujian yang cocok dengan filter.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ============================================================
  // GANTI DENGAN URL CSV DARI GOOGLE SHEETS ANDA
  // ============================================================
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuaFaUWw7_cMs_A5y08UlHQ7arqKuWkT6xWQTXaorGaLVrKzfGfTvf5UJWVJdgt_9MwMcNnbbTCVXY/pub?gid=0&single=true&output=csv";

  const daftarUjianEl = document.getElementById('daftarUjian');
  const filterKelasEl = document.getElementById('filterKelas');
  const searchInputEl = document.getElementById('searchInput');
  const statusInfoEl = document.getElementById('statusInfo');
  const emptyStateEl = document.getElementById('emptyState');

  let semuaData = [];

  // Parser CSV sederhana (mendukung tanda kutip)
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      const next = text[i + 1];

      if (inQuotes) {
        if (c === '"' && next === '"') { field += '"'; i++; }
        else if (c === '"') { inQuotes = false; }
        else { field += c; }
      } else {
        if (c === '"') { inQuotes = true; }
        else if (c === ',') { row.push(field); field = ''; }
        else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
        else if (c === '\r') { /* skip */ }
        else { field += c; }
      }
    }
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows;
  }

  // Escape HTML untuk mencegah XSS dari isi spreadsheet
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  async function muatData() {
    statusInfoEl.textContent = "Memuat data ujian...";
    daftarUjianEl.innerHTML = '';
    emptyStateEl.classList.add('d-none');

    try {
      const res = await fetch(CSV_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error("Gagal mengambil data (" + res.status + ")");

      const text = await res.text();
      const rows = parseCSV(text).filter(r => r.some(c => c.trim() !== ''));
      if (rows.length < 2) throw new Error("Data kosong.");

      // Mapping header ke objek
      const header = rows[0].map(h => h.trim().toLowerCase());
      semuaData = rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, i) => obj[h] = (r[i] || '').trim());
        return obj;
      });

      isiFilterKelas();
      render();
      statusInfoEl.textContent = `Menampilkan ${semuaData.length} ujian.`;
    } catch (err) {
      statusInfoEl.textContent = "";
      emptyStateEl.classList.remove('d-none');
      emptyStateEl.innerHTML = `<i class="bi bi-exclamation-triangle fs-1 d-block mb-2 text-warning"></i>
        <p class="mb-0">Gagal memuat data: ${esc(err.message)}</p>`;
    }
  }

  function isiFilterKelas() {
    const kelasSet = [...new Set(semuaData.map(d => d.kelas).filter(Boolean))].sort();
    filterKelasEl.innerHTML = '<option value="">Semua Kelas</option>' +
      kelasSet.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');
  }

  function render() {
    const fKelas = filterKelasEl.value.toLowerCase();
    const fSearch = searchInputEl.value.toLowerCase().trim();

    const filtered = semuaData.filter(d => {
      const cocokKelas = !fKelas || (d.kelas || '').toLowerCase() === fKelas;
      const cocokSearch = !fSearch ||
        (d.mata_pelajaran || '').toLowerCase().includes(fSearch) ||
        (d.guru || '').toLowerCase().includes(fSearch);
      return cocokKelas && cocokSearch;
    });

    daftarUjianEl.innerHTML = '';

    if (!filtered.length) {
      emptyStateEl.classList.remove('d-none');
      return;
    }
    emptyStateEl.classList.add('d-none');

    filtered.forEach(d => {
      const link = d.link_ujian || '';
      const linkAman = /^https?:\/\//i.test(link) ? link : '#';
      const disabled = linkAman === '#' ? 'disabled' : '';
      const target = linkAman === '#' ? '' : 'target="_blank" rel="noopener noreferrer"';

      const col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      col.innerHTML = `
        <div class="card-mapel p-3 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge badge-kelas">${esc(d.kelas || '-')}</span>
            <small class="text-secondary">${esc(d.tanggal || '')}</small>
          </div>
          <h5 class="fw-bold mb-1">${esc(d.mata_pelajaran || 'Tanpa Nama')}</h5>
          <p class="text-secondary small mb-3">
            <i class="bi bi-person-badge"></i> ${esc(d.guru || '-')}
          </p>
          <a href="${esc(linkAman)}" ${target}
             class="btn btn-mulai mt-auto ${disabled}">
            <i class="bi bi-box-arrow-up-right"></i> Mulai Ujian
          </a>
        </div>`;
      daftarUjianEl.appendChild(col);
    });
  }

  // Event listener
  filterKelasEl.addEventListener('change', render);
  searchInputEl.addEventListener('input', render);
  document.getElementById('btnReload').addEventListener('click', muatData);

  // Muat saat halaman siap
  muatData();
</script>

</body>
</html>
