<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Ujian - SMK YPM 3 TAMAN</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body { background: #1a1a2e; color: #fff; min-height: 100vh; }
    .card-mapel {
      background: #162447; border: 1px solid #1f4068; border-radius: 12px;
      transition: 0.25s; height: 100%;
    }
    .card-mapel:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(228, 63, 90, 0.25);
      border-color: #e43f5a;
    }
    .badge-kelas { background: #e43f5a; font-weight: 600; }
    .btn-mulai {
      background: #e43f5a; color: #fff; font-weight: 600; border: none;
    }
    .btn-mulai:hover { background: #ff4b6b; color: #fff; }
    .btn-mulai:disabled { background: #555; color: #aaa; }
    .filter-bar { background: #162447; border-radius: 12px; padding: 16px; }
    .school-logo { width: 80px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
    .empty-state {
      background: #162447; border-radius: 12px; padding: 40px;
      text-align: center; color: #cbd5e1;
    }
    .tanggal-info { color: #ffeb3b; font-weight: 600; }
  </style>
</head>
<body>

<div class="container py-4">

  <div class="text-center mb-4">
    <img src="logo1.jpg" alt="Logo" class="school-logo mb-2"
         onerror="this.style.display='none'">
    <h2 class="fw-bold mb-1">Portal Ujian Online</h2>
    <p class="text-secondary mb-0">SMK YPM 3 TAMAN</p>
    <p class="tanggal-info small mb-0 mt-1" id="infoTanggal"></p>
  </div>

  <div class="filter-bar mb-4">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label small text-secondary">Filter Kelas</label>
        <select id="filterKelas" class="form-select">
          <option value="">Semua Kelas</option>
        </select>
      </div>
      <div class="col-md-5">
        <label class="form-label small text-secondary">Cari Mata Pelajaran / Guru</label>
        <input type="text" id="searchInput" class="form-control" placeholder="Ketik untuk mencari...">
      </div>
      <div class="col-md-2">
        <button id="btnReload" class="btn btn-outline-light w-100">
          <i class="bi bi-arrow-clockwise"></i> Muat Ulang
        </button>
      </div>
    </div>
  </div>

  <div id="statusInfo" class="mb-3 small text-secondary"></div>
  <div class="row g-3" id="daftarUjian"></div>

  <div id="emptyState" class="empty-state d-none">
    <i class="bi bi-inbox fs-1 d-block mb-2"></i>
    <p class="mb-0" id="emptyMessage">Tidak ada ujian yang cocok dengan filter.</p>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // ============================================================
  // GANTI DENGAN URL CSV DARI GOOGLE SHEETS ANDA
  // ============================================================
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSuaFaUWw7_cMs_A5y08UlHQ7arqKuWkT6xWQTXaorGaLVrKzfGfTvf5UJWVJdgt_9MwMcNnbbTCVXY/pub?gid=0&single=true&output=csv";
  const FETCH_TIMEOUT_MS = 15000;

  const daftarUjianEl = document.getElementById('daftarUjian');
  const filterKelasEl = document.getElementById('filterKelas');
  const searchInputEl = document.getElementById('searchInput');
  const statusInfoEl = document.getElementById('statusInfo');
  const emptyStateEl = document.getElementById('emptyState');
  const emptyMessageEl = document.getElementById('emptyMessage');
  const infoTanggalEl = document.getElementById('infoTanggal');
  const btnReload = document.getElementById('btnReload');

  let semuaData = [];
  let isLoading = false;

  // ---------- Utility ----------

  // Escape HTML lengkap (termasuk kutip tunggal)
  function esc(str) {
    return String(str ?? '')
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  // Ambil tanggal hari ini dalam format YYYY-MM-DD (zona waktu lokal)
  function tanggalHariIni() {
    const d = new Date();
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // Format YYYY-MM-DD menjadi "5 November 2026" untuk tampilan
  function formatTanggalIndo(isoDate) {
    const bulan = ['Januari','Februari','Maret','April','Mei','Juni',
                   'Juli','Agustus','September','Oktober','November','Desember'];
    const [y, m, d] = isoDate.split('-').map(Number);
    if (!y || !m || !d) return isoDate;
    return `${d} ${bulan[m - 1]} ${y}`;
  }

  // Normalisasi berbagai format tanggal menjadi YYYY-MM-DD.
  // Mendukung: YYYY-MM-DD, DD/MM/YYYY, DD-MM-YYYY, DD/MM/YY,
  // dan format teks Indonesia "5 November 2026".
  function normalisasiTanggal(str) {
    if (!str) return '';
    str = String(str).trim();

    // YYYY-MM-DD (opsional dengan jam)
    let m = str.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (m) return `${m[1]}-${m[2]}-${m[3]}`;

    // DD/MM/YYYY atau DD-MM-YYYY atau DD-MM-YY
    m = str.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})$/);
    if (m) {
      let dd = m[1].padStart(2, '0');
      let mm = m[2].padStart(2, '0');
      let yyyy = m[3];
      if (yyyy.length === 2) yyyy = '20' + yyyy;
      return `${yyyy}-${mm}-${dd}`;
    }

    // Format teks Indonesia: "5 November 2026"
    const bulanMap = {
      januari: '01', februari: '02', maret: '03', april: '04',
      mei: '05', juni: '06', juli: '07', agustus: '08',
      september: '09', oktober: '10', november: '11', desember: '12'
    };
    m = str.toLowerCase().match(/^(\d{1,2})\s+([a-z]+)\s+(\d{4})$/);
    if (m && bulanMap[m[2]]) {
      return `${m[3]}-${bulanMap[m[2]]}-${m[1].padStart(2, '0')}`;
    }

    return str; // tidak dikenali
  }

  // ---------- CSV Parser ----------

  // Parser CSV yang menangani kutip, escaped quote (""),
  // dan line ending \r\n / \n / \r dengan benar.
  function parseCSV(text) {
    const rows = [];
    let row = [], field = '', inQuotes = false;
    let i = 0;
    const len = text.length;

    while (i < len) {
      const c = text[i];

      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i += 2; continue; }
          inQuotes = false; i++; continue;
        }
        field += c; i++; continue;
      }

      if (c === '"') { inQuotes = true; i++; continue; }
      if (c === ',') { row.push(field); field = ''; i++; continue; }
      if (c === '\r') {
        // \r\n atau \r saja
        if (text[i + 1] === '\n') i++;
        row.push(field); rows.push(row);
        row = []; field = ''; i++; continue;
      }
      if (c === '\n') {
        row.push(field); rows.push(row);
        row = []; field = ''; i++; continue;
      }
      field += c; i++;
    }

    // Sisa terakhir
    if (field.length || row.length) { row.push(field); rows.push(row); }
    return rows.filter(r => r.some(c => c.trim() !== ''));
  }

  // ---------- Fetch dengan timeout ----------

  async function fetchCSV(url) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), FETCH_TIMEOUT_MS);
    try {
      const res = await fetch(url, { cache: 'no-store', signal: controller.signal });
      if (!res.ok) throw new Error("Gagal mengambil data (" + res.status + ")");
      return await res.text();
    } finally {
      clearTimeout(timer);
    }
  }

  // ---------- Load & Render ----------

  async function muatData() {
    if (isLoading) return;
    isLoading = true;
    btnReload.disabled = true;
    statusInfoEl.textContent = "Memuat data ujian...";
    daftarUjianEl.innerHTML = '';
    emptyStateEl.classList.add('d-none');

    const hariIni = tanggalHariIni();
    infoTanggalEl.textContent = "Ujian untuk: " + formatTanggalIndo(hariIni);

    try {
      const text = await fetchCSV(CSV_URL);
      const rows = parseCSV(text);
      if (rows.length < 2) throw new Error("Data kosong atau hanya berisi header.");

      // Normalisasi header: lowercase, trim, ganti spasi dengan underscore
      const header = rows[0].map(h => h.trim().toLowerCase().replace(/\s+/g, '_'));

      // Pastikan kolom wajib ada
      const wajib = ['kelas', 'mata_pelajaran', 'link_ujian'];
      const hilang = wajib.filter(k => !header.includes(k));
      if (hilang.length) {
        throw new Error("Kolom wajib tidak ditemukan: " + hilang.join(', '));
      }

      // Mapping baris ke objek
      semuaData = rows.slice(1).map(r => {
        const obj = {};
        header.forEach((h, idx) => {
          // Jika header duplikat, ambil nilai pertama yang non-kosong
          if (obj[h] === undefined || obj[h] === '') {
            obj[h] = (r[idx] || '').trim();
          }
        });
        // Simpan tanggal ternormalisasi untuk filter
        obj._tanggalISO = normalisasiTanggal(obj.tanggal || '');
        return obj;
      });

      isiFilterKelas();
      render();
    } catch (err) {
      semuaData = [];
      statusInfoEl.textContent = "";
      emptyStateEl.classList.remove('d-none');
      emptyMessageEl.innerHTML =
        `<i class="bi bi-exclamation-triangle fs-1 d-block mb-2 text-warning"></i>` +
        `Gagal memuat data: ${esc(err.message)}`;
    } finally {
      isLoading = false;
      btnReload.disabled = false;
    }
  }

  function isiFilterKelas() {
    const nilaiLama = filterKelasEl.value;
    const kelasSet = [...new Set(semuaData.map(d => d.kelas).filter(Boolean))].sort();

    filterKelasEl.innerHTML = '<option value="">Semua Kelas</option>' +
      kelasSet.map(k => `<option value="${esc(k)}">${esc(k)}</option>`).join('');

    // Pulihkan pilihan lama jika masih ada
    if (kelasSet.includes(nilaiLama)) {
      filterKelasEl.value = nilaiLama;
    }
  }

  function render() {
    const fKelas = filterKelasEl.value.toLowerCase();
    const fSearch = searchInputEl.value.toLowerCase().trim();
    const hariIni = tanggalHariIni();

    // Filter: hanya ujian hari ini + kelas + pencarian
    const filtered = semuaData.filter(d => {
      if (d._tanggalISO !== hariIni) return false;
      const cocokKelas = !fKelas || (d.kelas || '').toLowerCase() === fKelas;
      const cocokSearch = !fSearch ||
        (d.mata_pelajaran || '').toLowerCase().includes(fSearch) ||
        (d.guru || '').toLowerCase().includes(fSearch);
      return cocokKelas && cocokSearch;
    });

    daftarUjianEl.innerHTML = '';

    if (!filtered.length) {
      emptyStateEl.classList.remove('d-none');
      emptyMessageEl.innerHTML =
        `<i class="bi bi-inbox fs-1 d-block mb-2"></i>` +
        `<p class="mb-0">Tidak ada ujian untuk hari ini (${esc(formatTanggalIndo(hariIni))})` +
        ` yang cocok dengan filter.</p>`;
      statusInfoEl.textContent = "";
      return;
    }

    emptyStateEl.classList.add('d-none');

    filtered.forEach(d => {
      const link = d.link_ujian || '';
      const linkValid = /^https?:\/\//i.test(link);
      const linkAman = linkValid ? link : '#';
      const disabled = linkValid ? '' : 'disabled';
      const target = linkValid ? 'target="_blank" rel="noopener noreferrer"' : '';

      const col = document.createElement('div');
      col.className = 'col-md-6 col-lg-4';
      col.innerHTML = `
        <div class="card-mapel p-3 d-flex flex-column">
          <div class="d-flex justify-content-between align-items-start mb-2">
            <span class="badge badge-kelas">${esc(d.kelas || '-')}</span>
            <small class="text-secondary">${esc(formatTanggalIndo(d._tanggalISO) || d.tanggal || '')}</small>
          </div>
          <h5 class="fw-bold mb-1">${esc(d.mata_pelajaran || 'Tanpa Nama')}</h5>
          <p class="text-secondary small mb-3">
            <i class="bi bi-person-badge"></i> ${esc(d.guru || '-')}
          </p>
          ${linkValid
            ? `<a href="${esc(linkAman)}" ${target} class="btn btn-mulai mt-auto">
                 <i class="bi bi-box-arrow-up-right"></i> Mulai Ujian
               </a>`
            : `<button class="btn btn-mulai mt-auto" disabled>
                 <i class="bi bi-exclamation-circle"></i> Link tidak tersedia
               </button>`}
        </div>`;
      daftarUjianEl.appendChild(col);
    });

    statusInfoEl.textContent =
      `Menampilkan ${filtered.length} ujian hari ini (${formatTanggalIndo(hariIni)}).`;
  }

  // ---------- Event ----------

  filterKelasEl.addEventListener('change', render);
  searchInputEl.addEventListener('input', render);
  btnReload.addEventListener('click', muatData);

  muatData();
</script>

</body>
</html>
